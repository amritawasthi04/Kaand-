name: newstler
description: Flutter News App with Provider

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0

  # State
  provider: ^6.1.2

  # Network
  http: ^1.2.1
  dio: ^5.4.3
  cached_network_image: ^3.4.1

  # Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # RSS parsing
  xml: ^6.5.0
  html: ^0.15.4

  # UI
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  go_router: ^17.3.0
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Globe.png